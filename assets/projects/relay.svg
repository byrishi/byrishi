<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<foreignObject x="0" y="0" width="1200" height="630">
<div xmlns="http://www.w3.org/1999/xhtml" class="root">
<style>
@font-face{font-family:A;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:G;src:url(data:font/woff2;base64,) format("woff2");font-weight:400}
@font-face{font-family:G;src:url(data:font/woff2;base64,) format("woff2");font-weight:700}
.root{width:1200px;height:630px;position:relative;overflow:hidden;background:#F2F3F7;font-family:G}
.sheet{position:absolute;left:28px;top:28px;right:28px;bottom:28px;border-radius:36px;background:#1631E0;color:#fff;padding:50px 60px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;letter-spacing:-.03em}
.k{font-size:24px;color:#D3D9FF;animation:fade .8s ease 1.2s both}
h1{margin:auto 0 0;font-family:A;font-weight:400;font-size:128px;line-height:.92;letter-spacing:-.01em;max-width:1000px;position:relative}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:34px;font-size:23px;color:#D3D9FF;position:relative;animation:fade .8s ease 1.4s both}
.u{background:#fff;color:#1631E0;border-radius:999px;padding:9px 20px;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#1631E0;animation:live 1.8s ease-in-out infinite}
.c{opacity:0;animation:fade .01s linear both}
.pk{animation:hop 3.6s cubic-bezier(.6,0,.3,1) 1.4s infinite both}
.w{display:inline-block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.fly{position:absolute;left:-20px;background:#8FA0FF;animation:fly 10s steps(46) infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(46px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes hop{0%,20%{transform:none;opacity:1}45%{transform:translate(5px,-1px);opacity:0}46%{transform:translate(-2px,0);opacity:0}70%,100%{transform:none;opacity:1}}
@keyframes fly{from{transform:translateX(0)}to{transform:translateX(1180px)}}
@keyframes live{0%,100%{opacity:1;transform:none}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.c{opacity:1}}
</style>
<div class="sheet"><i class="fly" style="top:270px;width:12px;height:12px;opacity:0.33;animation-duration:9.2s;animation-delay:-7.2s"></i><i class="fly" style="top:190px;width:12px;height:12px;opacity:0.18;animation-duration:12.0s;animation-delay:-3.1s"></i><i class="fly" style="top:270px;width:8px;height:8px;opacity:0.45;animation-duration:9.8s;animation-delay:-10.0s"></i><i class="fly" style="top:430px;width:10px;height:10px;opacity:0.35;animation-duration:7.9s;animation-delay:-7.6s"></i><i class="fly" style="top:470px;width:10px;height:10px;opacity:0.38;animation-duration:11.0s;animation-delay:-0.8s"></i><i class="fly" style="top:150px;width:10px;height:10px;opacity:0.39;animation-duration:11.9s;animation-delay:-3.2s"></i><i class="fly" style="top:390px;width:12px;height:12px;opacity:0.39;animation-duration:9.6s;animation-delay:-8.7s"></i><i class="fly" style="top:430px;width:8px;height:8px;opacity:0.42;animation-duration:7.6s;animation-delay:-1.6s"></i><i class="fly" style="top:270px;width:10px;height:10px;opacity:0.44;animation-duration:9.6s;animation-delay:-7.5s"></i>
<div class="top"><div class="logo"><svg xmlns="http://www.w3.org/2000/svg" height="30" viewBox="0 0 6 7" shape-rendering="crispEdges" style="overflow:visible"><g fill="#fff"><rect class="c" style="animation-delay:0.250s" x="0.07" y="0.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.295s" x="1.07" y="0.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.340s" x="2.07" y="0.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.385s" x="3.07" y="0.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.430s" x="0.07" y="1.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.475s" x="4.07" y="1.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.520s" x="0.07" y="2.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.565s" x="4.07" y="2.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.610s" x="0.07" y="3.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.655s" x="1.07" y="3.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.700s" x="2.07" y="3.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.745s" x="3.07" y="3.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.790s" x="0.07" y="4.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.835s" x="2.07" y="4.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.880s" x="0.07" y="5.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.925s" x="3.07" y="5.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:0.970s" x="0.07" y="6.07" width="0.86" height="0.86"/><rect class="c" style="animation-delay:1.015s" x="4.07" y="6.07" width="0.86" height="0.86"/></g><rect class="pk" x="5.07" y="0.07" width="0.86" height="0.86" fill="#8FA0FF"/></svg>Relay</div><span class="k">Free file transfer</span></div>
<h1><span class="w" style="animation-delay:0.55s">Send</span> <span class="w" style="animation-delay:0.64s">files</span> <span class="w" style="animation-delay:0.73s">straight</span> <span class="w" style="animation-delay:0.82s">to</span> <span class="w" style="animation-delay:0.91s">another</span> <span class="w" style="animation-delay:1.00s">device.</span></h1>
