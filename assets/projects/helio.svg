<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<foreignObject x="0" y="0" width="1200" height="630">
<div xmlns="http://www.w3.org/1999/xhtml" class="root">
<style>
@font-face{font-family:Instrument;src:url(data:font/woff2;base64,) format("woff2");font-weight:400}
@font-face{font-family:Instrument;src:url(data:font/woff2;base64,) format("woff2");font-weight:500}
.root{width:1200px;height:630px;display:flex;background:#f6f7f8;padding:16px;font-family:Instrument;box-sizing:border-box}
.card{position:relative;display:flex;width:100%;height:100%;border-radius:22px;overflow:hidden;color:#101418}
.abs{position:absolute}
.sky{left:0;top:0;width:1168px;height:399px;background-image:linear-gradient(180deg,#8db0d4 0%,#c3d7e9 55%,#eef2f4 88%,#f7ead6 100%)}
.warm{left:0;top:0;width:1168px;height:399px;background-image:linear-gradient(180deg,rgba(255,190,120,0) 40%,rgba(255,190,120,.35) 100%);animation:warm 3.2s ease .3s both}
.glow{left:634.0px;top:71.0px;width:600px;height:600px;border-radius:999px;background-image:radial-gradient(circle,rgba(255,251,235,1) 0%,rgba(253,224,160,.9) 8%,rgba(252,211,77,.35) 26%,rgba(252,211,77,0) 60%);animation:glowin 3.2s cubic-bezier(.2,.8,.2,1) .3s both,breathe 6s ease-in-out 3.5s infinite}
.sun{left:906px;top:321px;width:56px;height:56px;border-radius:999px;background:#fffdf6;box-shadow:0 0 40px 10px rgba(255,240,200,.6);animation:rise 3.2s cubic-bezier(.2,.8,.2,1) .3s both}
.panels{left:0;top:399px;width:1168px;height:199px;display:flex;flex-direction:column;background:#17324f;overflow:hidden}
.sweep{position:absolute;top:0;bottom:0;width:260px;left:-300px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(190,210,235,.16),rgba(255,255,255,0));transform:skewX(-20deg);animation:sweep 7s ease-in-out 3s infinite}
.refl{left:854px;top:399px;width:160px;height:199px;background-image:linear-gradient(90deg,rgba(253,224,160,0) 0%,rgba(253,224,160,.55) 50%,rgba(253,224,160,0) 100%);transform-origin:top;animation:reflin 2s ease 2.4s both,shim 3s ease-in-out 4.4s infinite}
.content{position:relative;display:flex;flex-direction:column;padding:52px 60px 40px;width:100%;height:100%;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:500;letter-spacing:-1.3px;animation:fade .8s ease .2s both}
.ray{stroke-dasharray:3;stroke-dashoffset:3;animation:draw .4s ease forwards}
.rays{transform-origin:16px 16px;animation:spin 30s linear 1.4s infinite}
.core{transform-origin:16px 16px;animation:pulse 3s ease-in-out 1.4s infinite}
.t{font-size:62px;font-weight:500;line-height:1.02;letter-spacing:-2.17px;max-width:760px}
.w{display:inline-block;animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.sub{margin-top:18px;font-size:27px;line-height:1.3;color:rgba(16,20,24,.7);max-width:660px;animation:fade 1s ease 1.6s both}
.foot{display:flex;margin-top:auto;gap:18px;font-size:21px;color:rgba(255,255,255,.9);animation:fade 1s ease 2.6s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(30px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{transform:translateY(150px)}to{transform:none}}
@keyframes glowin{from{transform:translateY(150px) scale(.35);opacity:0}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(1.08);opacity:.88}}
@keyframes warm{from{opacity:0}50%{opacity:1}to{opacity:0}}
@keyframes reflin{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes shim{0%,100%{opacity:1;transform:scaleX(1)}50%{opacity:.7;transform:scaleX(.8)}}
@keyframes sweep{0%{left:-300px}60%,100%{left:1228px}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(.86)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ray{stroke-dashoffset:0}}
</style>
<div class="card">
<div class="abs sky"></div><div class="abs warm"></div>
<div class="abs glow"></div><div class="abs sun"></div>
<div class="abs panels"><div style="height:3px;margin-top:7px;background:rgba(190,205,220,0.32)"></div><div style="height:6px;margin-top:13px;background:rgba(190,205,220,0.29)"></div><div style="height:8px;margin-top:20px;background:rgba(190,205,220,0.26)"></div><div style="height:10px;margin-top:27px;background:rgba(190,205,220,0.23)"></div><div style="height:12px;margin-top:33px;background:rgba(190,205,220,0.20)"></div><div style="height:14px;margin-top:40px;background:rgba(190,205,220,0.17)"></div><div style="height:17px;margin-top:46px;background:rgba(190,205,220,0.14)"></div><div class="sweep"></div></div>
<div class="abs refl"></div>
<div class="content">
<div class="brand"><svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#ff5e1f"/><circle class="core" cx="16" cy="16" r="5" fill="#fff"/><g class="rays" stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none"><path class="ray" style="animation-delay:0.40s" d="M16 5.5v2.4"/><path class="ray" style="animation-delay:0.47s" d="M21.7 10.3l1.7-1.7"/><path class="ray" style="animation-delay:0.54s" d="M24.1 16h2.4"/><path class="ray" style="animation-delay:0.61s" d="M21.7 21.7l1.7 1.7"/><path class="ray" style="animation-delay:0.68s" d="M16 24.1v2.4"/><path class="ray" style="animation-delay:0.75s" d="M8.6 23.4l1.7-1.7"/><path class="ray" style="animation-delay:0.82s" d="M5.5 16h2.4"/><path class="ray" style="animation-delay:0.89s" d="M8.6 8.6l1.7 1.7"/></g></svg>Helio</div>
<div style="display:flex;flex-direction:column;margin-top:auto;margin-bottom:181px">
<div class="t"><span class="w" style="animation-delay:0.90s">Know</span> <span class="w" style="animation-delay:0.97s">exactly</span> <span class="w" style="animation-delay:1.04s">what</span> <span class="w" style="animation-delay:1.11s">your</span> <span class="w" style="animation-delay:1.18s">roof</span> <span class="w" style="animation-delay:1.25s">made</span> <span class="w" style="animation-delay:1.32s">today</span></div>
<div class="sub">A free, open-source dashboard for rooftop solar.</div></div>
<div class="foot"><span>helio.rishishah.in</span><span style="color:rgba(255,255,255,.6)">Free and open source</span></div>
</div></div></div></foreignObject></svg>