    @keyframes in{to{opacity:1}}
    .blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style></defs>
  <rect x=".5" y=".5" width="1199" height="259" rx="16" fill="#0b0b0b" stroke="#222"/>
  <circle cx="30" cy="28" r="6" fill="#2a2a2a"/><circle cx="50" cy="28" r="6" fill="#2a2a2a"/><circle cx="70" cy="28" r="6" fill="#2a2a2a"/>
